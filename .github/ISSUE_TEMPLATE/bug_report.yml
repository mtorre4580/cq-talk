name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Tune 14.205 MHz (Climate change)
        2. Tap the microphone
        3. …
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Desktop browser
        - Android phone (browser)
        - Android phone (installed app)
        - iPhone / iPad (Safari)
        - iPhone / iPad (installed app)
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 142, Safari 19…
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not paste my API key or any personal data in this issue
          required: true
